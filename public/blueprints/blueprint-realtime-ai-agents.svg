<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" fill="none">
  <rect width="960" height="520" rx="16" fill="#090A11" />
  <rect x="0.5" y="0.5" width="959" height="519" rx="15.5" stroke="#1E2333" />
  <pattern id="grid3" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
  </pattern>
  <rect width="960" height="520" fill="url(#grid3)" />

  <!-- Header -->
  <text x="40" y="44" fill="#06B6D4" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="1">AI AGENTS ARCHITECTURE // REALTIME STREAMING PIPELINE</text>
  <text x="40" y="70" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="bold">Pipeline de Ultra Baja Latencia con Silero VAD, Redis Streams &amp; Neural Audio</text>

  <!-- Stage 1: Audio Ingestion -->
  <rect x="40" y="120" width="180" height="340" rx="12" fill="#121524" stroke="#06B6D4" stroke-width="1.5" />
  <text x="130" y="150" fill="#67E8F9" font-family="monospace" font-size="12" text-anchor="middle" font-weight="bold">1. Ingestión de Audio</text>
  <text x="130" y="170" fill="#64748B" font-family="sans-serif" font-size="9" text-anchor="middle">WebRTC / WebSocket</text>

  <rect x="55" y="195" width="150" height="60" rx="8" fill="#0C0E18" stroke="#333950" />
  <text x="130" y="220" fill="#FFFFFF" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">Audio Stream</text>
  <text x="130" y="238" fill="#38BDF8" font-family="sans-serif" font-size="9" text-anchor="middle">Opus / PCM 16kHz</text>

  <rect x="55" y="275" width="150" height="60" rx="8" fill="#0C0E18" stroke="#333950" />
  <text x="130" y="300" fill="#FFFFFF" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">Silero VAD (Edge)</text>
  <text x="130" y="318" fill="#34D399" font-family="sans-serif" font-size="9" text-anchor="middle">Filtro de Silencios (&lt;20ms)</text>

  <rect x="55" y="355" width="150" height="60" rx="8" fill="#0C0E18" stroke="#333950" />
  <text x="130" y="380" fill="#FFFFFF" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">Streaming STT</text>
  <text x="130" y="398" fill="#FBBF24" font-family="sans-serif" font-size="9" text-anchor="middle">Whisper / Deepgram Stream</text>

  <!-- Arrow to Stage 2 -->
  <path d="M 220 290 L 270 290" stroke="#06B6D4" stroke-width="2"/>
  <polygon points="274,290 266,286 266,294" fill="#06B6D4" />

