  <text x="382" y="278" fill="#F43F5E" font-family="monospace" font-size="9" text-anchor="middle">Latencia: &lt; 5ms</text>

  <rect x="490" y="195" width="175" height="100" rx="8" fill="#0C0E18" stroke="#A855F7" stroke-opacity="0.6" />
