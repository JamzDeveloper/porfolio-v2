  <text x="480" y="360" fill="#94A3B8" font-family="sans-serif" font-size="9" text-anchor="middle">Zod Schemas + LLM Evaluation (Gemini 2.5 / GPT-4o)</text>
  
  <rect x="310" y="375" width="105" height="40" rx="4" fill="#151A2E" stroke="#333950" />
  <text x="362" y="395" fill="#38BDF8" font-family="monospace" font-size="9" text-anchor="middle">NuriPoint Telemetry</text>
  <text x="362" y="408" fill="#64748B" font-family="sans-serif" font-size="8" text-anchor="middle">Offline GPS / Tracks</text>

  <rect x="425" y="375" width="105" height="40" rx="4" fill="#151A2E" stroke="#333950" />
  <text x="477" y="395" fill="#FBBF24" font-family="monospace" font-size="9" text-anchor="middle">Weather &amp; Alerts</text>
  <text x="477" y="408" fill="#64748B" font-family="sans-serif" font-size="8" text-anchor="middle">OpenMeteo API</text>

  <rect x="540" y="375" width="105" height="40" rx="4" fill="#151A2E" stroke="#333950" />
  <text x="592" y="395" fill="#F472B6" font-family="monospace" font-size="9" text-anchor="middle">Banking / Orders</text>
  <text x="592" y="408" fill="#64748B" font-family="sans-serif" font-size="8" text-anchor="middle">Transaccional</text>

  <!-- Arrow to Stage 3 -->
  <path d="M 685 290 L 735 290" stroke="#6366F1" stroke-width="2"/>
  <polygon points="739,290 731,286 731,294" fill="#6366F1" />

  <!-- Stage 3: Audio Synthesis & Streaming -->
  <rect x="740" y="120" width="180" height="340" rx="12" fill="#121524" stroke="#10B981" stroke-width="1.5" />
  <text x="830" y="150" fill="#6EE7B7" font-family="monospace" font-size="12" text-anchor="middle" font-weight="bold">3. Salida de Voz</text>
  <text x="830" y="170" fill="#64748B" font-family="sans-serif" font-size="9" text-anchor="middle">Streaming Progresivo</text>

  <rect x="755" y="195" width="150" height="60" rx="8" fill="#0C0E18" stroke="#333950" />
  <text x="830" y="220" fill="#FFFFFF" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">Token Streamer</text>
  <text x="830" y="238" fill="#A7F3D0" font-family="sans-serif" font-size="9" text-anchor="middle">Generación de Chunks</text>

  <rect x="755" y="275" width="150" height="60" rx="8" fill="#0C0E18" stroke="#333950" />
  <text x="830" y="300" fill="#FFFFFF" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">Neural TTS</text>
  <text x="830" y="318" fill="#F472B6" font-family="sans-serif" font-size="9" text-anchor="middle">ElevenLabs / Edge TTS</text>

  <rect x="755" y="355" width="150" height="60" rx="8" fill="#0C0E18" stroke="#333950" />
  <text x="830" y="380" fill="#FFFFFF" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">Buffer Queue</text>
  <text x="830" y="398" fill="#38BDF8" font-family="sans-serif" font-size="9" text-anchor="middle">Reproducción Continua</text>

  <!-- Footer Specs -->
  <text x="40" y="495" fill="#64748B" font-family="monospace" font-size="10">Time to First Audio (TTFA): &lt; 750ms · Audio Bidireccional Full-Duplex · Arquitectura Desacoplada</text>
</svg>
