  <text x="577" y="240" fill="#94A3B8" font-family="sans-serif" font-size="9" text-anchor="middle">Memoria Semántica / RAG</text>
  <text x="577" y="258" fill="#94A3B8" font-family="sans-serif" font-size="9" text-anchor="middle">Base de Conocimiento</text>
  <text x="577" y="278" fill="#C084FC" font-family="monospace" font-size="9" text-anchor="middle">Cosine Similarity</text>

  <!-- Tool Calling Engine -->
  <rect x="295" y="315" width="370" height="115" rx="8" fill="#0C0E18" stroke="#10B981" stroke-opacity="0.6" />
