<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" fill="none">
  <rect width="960" height="520" rx="16" fill="#090A11" />
  <rect x="0.5" y="0.5" width="959" height="519" rx="15.5" stroke="#1E2333" />
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
  </pattern>
  <rect width="960" height="520" fill="url(#grid)" />

  <!-- Header -->
  <text x="40" y="44" fill="#10B981" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="1">SYSTEM DESIGN BLUEPRINT // EVENT-DRIVEN TRANSACTIONAL OUTBOX</text>
  <text x="40" y="70" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="bold">Garantía de Consistencia Eventual con Apache Kafka &amp; PostgreSQL</text>

  <!-- Flow Items -->
  <!-- 1. Client -->
  <rect x="40" y="140" width="120" height="90" rx="8" fill="#121522" stroke="#333950" stroke-width="1.5" />
  <text x="100" y="180" fill="#94A3B8" font-family="monospace" font-size="12" text-anchor="middle" font-weight="bold">Client App</text>
  <text x="100" y="200" fill="#64748B" font-family="sans-serif" font-size="10" text-anchor="middle">HTTP / REST</text>

  <!-- Arrow 1 -->
  <path d="M 160 185 L 210 185" stroke="#10B981" stroke-width="2" stroke-dasharray="4 2"/>
  <polygon points="214,185 206,181 206,189" fill="#10B981" />

  <!-- 2. API Gateway & Auth -->
  <rect x="215" y="140" width="130" height="90" rx="8" fill="#121522" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="280" y="175" fill="#FFFFFF" font-family="monospace" font-size="12" text-anchor="middle" font-weight="bold">API Gateway</text>
  <text x="280" y="195" fill="#10B981" font-family="sans-serif" font-size="10" text-anchor="middle">Rate Limit &amp; JWT</text>
  <text x="280" y="210" fill="#64748B" font-family="sans-serif" font-size="9" text-anchor="middle">Reverse Proxy</text>

  <!-- Arrow 2 -->
  <path d="M 345 185 L 395 185" stroke="#10B981" stroke-width="2"/>
  <polygon points="399,185 391,181 391,189" fill="#10B981" />

  <!-- 3. Primary Service (Order Core) -->
  <rect x="400" y="110" width="190" height="250" rx="10" fill="#121524" stroke="#6366F1" stroke-width="1.5" />
  <rect x="410" y="120" width="170" height="28" rx="6" fill="#6366F1" fill-opacity="0.15" />
  <text x="495" y="139" fill="#A5B4FC" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">Order Service (NestJS)</text>

  <!-- Inside Service: Transaction Scope -->
  <rect x="415" y="165" width="160" height="85" rx="6" fill="#0C0E18" stroke="#333950" />
  <text x="495" y="185" fill="#F8FAFC" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="600">DB ACID Transaction</text>
  <text x="495" y="205" fill="#38BDF8" font-family="monospace" font-size="10" text-anchor="middle">1. INSERT INTO orders</text>
  <text x="495" y="225" fill="#34D399" font-family="monospace" font-size="10" text-anchor="middle">2. INSERT INTO outbox</text>

  <!-- Outbox Relay Worker -->
  <rect x="415" y="265" width="160" height="75" rx="6" fill="#0C0E18" stroke="#F59E0B" stroke-opacity="0.5" />
  <text x="495" y="288" fill="#FBBF24" font-family="monospace" font-size="10" text-anchor="middle" font-weight="bold">Outbox Relay / Poller</text>
  <text x="495" y="308" fill="#94A3B8" font-family="sans-serif" font-size="9" text-anchor="middle">CDC / Debezium Stream</text>
  <text x="495" y="325" fill="#64748B" font-family="sans-serif" font-size="9" text-anchor="middle">Zero Message Loss</text>

  <!-- Arrow to Kafka -->
  <path d="M 575 305 L 635 305" stroke="#F59E0B" stroke-width="2"/>
  <polygon points="639,305 631,301 631,309" fill="#F59E0B" />

  <!-- 4. Kafka Event Bus -->
  <rect x="640" y="110" width="110" height="370" rx="12" fill="#131726" stroke="#EC4899" stroke-width="1.5" />
  <text x="695" y="145" fill="#F472B6" font-family="monospace" font-size="12" text-anchor="middle" font-weight="bold">Apache</text>
  <text x="695" y="165" fill="#F472B6" font-family="monospace" font-size="12" text-anchor="middle" font-weight="bold">Kafka</text>
  <text x="695" y="185" fill="#94A3B8" font-family="sans-serif" font-size="9" text-anchor="middle">Event Broker</text>
  
  <rect x="650" y="210" width="90" height="35" rx="4" fill="#0C0E18" stroke="#333950" />
  <text x="695" y="232" fill="#E2E8F0" font-family="monospace" font-size="9" text-anchor="middle">order.created</text>

  <rect x="650" y="260" width="90" height="35" rx="4" fill="#0C0E18" stroke="#333950" />
  <text x="695" y="282" fill="#E2E8F0" font-family="monospace" font-size="9" text-anchor="middle">order.paid</text>

  <rect x="650" y="310" width="90" height="35" rx="4" fill="#0C0E18" stroke="#333950" />
  <text x="695" y="332" fill="#E2E8F0" font-family="monospace" font-size="9" text-anchor="middle">order.shipped</text>

  <text x="695" y="440" fill="#64748B" font-family="monospace" font-size="9" text-anchor="middle">Partitioning by</text>
  <text x="695" y="455" fill="#38BDF8" font-family="monospace" font-size="9" text-anchor="middle">orderId (Key)</text>

  <!-- Consumers (Right Column) -->
  <!-- Consumer 1: Payment -->
  <path d="M 750 230 L 800 210" stroke="#38BDF8" stroke-width="1.5" />
  <polygon points="803,209 794,208 798,215" fill="#38BDF8" />
  <rect x="805" y="175" width="120" height="65" rx="8" fill="#121524" stroke="#38BDF8" stroke-opacity="0.5" />
  <text x="865" y="200" fill="#BAE6FD" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">Payment Service</text>
  <text x="865" y="220" fill="#64748B" font-family="sans-serif" font-size="9" text-anchor="middle">Idempotent Consumer</text>

  <!-- Consumer 2: Inventory -->
  <path d="M 750 280 L 800 280" stroke="#34D399" stroke-width="1.5" />
  <polygon points="804,280 796,276 796,284" fill="#34D399" />
  <rect x="805" y="255" width="120" height="65" rx="8" fill="#121524" stroke="#34D399" stroke-opacity="0.5" />
  <text x="865" y="280" fill="#A7F3D0" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">Inventory Svc</text>
  <text x="865" y="300" fill="#64748B" font-family="sans-serif" font-size="9" text-anchor="middle">Stock Reservation</text>

  <!-- Consumer 3: Notification -->
  <path d="M 750 330 L 800 350" stroke="#A855F7" stroke-width="1.5" />
  <polygon points="803,351 798,344 794,352" fill="#A855F7" />
  <rect x="805" y="335" width="120" height="65" rx="8" fill="#121524" stroke="#A855F7" stroke-opacity="0.5" />
  <text x="865" y="360" fill="#E9D5FF" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">Notifier Worker</text>
  <text x="865" y="380" fill="#64748B" font-family="sans-serif" font-size="9" text-anchor="middle">WhatsApp / Email Push</text>

  <!-- Footer Specs -->
  <text x="40" y="490" fill="#64748B" font-family="monospace" font-size="10">Resistencia: At-least-once delivery garantizado · Dead Letter Queue (DLQ) activada · Escala horizontal sin candados distribuidos</text>
</svg>
