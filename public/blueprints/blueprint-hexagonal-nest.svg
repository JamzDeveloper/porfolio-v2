<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" fill="none">
  <rect width="960" height="520" rx="16" fill="#090A11" />
  <rect x="0.5" y="0.5" width="959" height="519" rx="15.5" stroke="#1E2333" />
  <pattern id="grid2" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
  </pattern>
  <rect width="960" height="520" fill="url(#grid2)" />

  <!-- Header -->
  <text x="40" y="44" fill="#6366F1" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="1">HEXAGONAL ARCHITECTURE // PORTS &amp; ADAPTERS (DDD IN NESTJS)</text>
  <text x="40" y="70" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="bold">Desacoplamiento Estricto del Dominio respecto a Frameworks &amp; Infraestructura</text>

  <!-- Left: Primary / Driving Adapters -->
  <rect x="40" y="110" width="220" height="370" rx="12" fill="#121524" stroke="#3B82F6" stroke-width="1.5" />
  <text x="150" y="140" fill="#93C5FD" font-family="monospace" font-size="12" text-anchor="middle" font-weight="bold">Driving Adapters (Input)</text>
  <text x="150" y="160" fill="#64748B" font-family="sans-serif" font-size="9" text-anchor="middle">Desencadenan casos de uso</text>

  <rect x="55" y="180" width="190" height="55" rx="8" fill="#0C0E18" stroke="#333950" />
  <text x="150" y="205" fill="#FFFFFF" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">HTTP Controllers</text>
  <text x="150" y="222" fill="#38BDF8" font-family="sans-serif" font-size="9" text-anchor="middle">NestJS Express / Fastify</text>

  <rect x="55" y="250" width="190" height="55" rx="8" fill="#0C0E18" stroke="#333950" />
  <text x="150" y="275" fill="#FFFFFF" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">WebSocket Gateway</text>
  <text x="150" y="292" fill="#A855F7" font-family="sans-serif" font-size="9" text-anchor="middle">Realtime Events &amp; Streams</text>

  <rect x="55" y="320" width="190" height="55" rx="8" fill="#0C0E18" stroke="#333950" />
  <text x="150" y="345" fill="#FFFFFF" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">Cron / Scheduled Jobs</text>
  <text x="150" y="362" fill="#F59E0B" font-family="sans-serif" font-size="9" text-anchor="middle">Background Batch Tasks</text>

  <rect x="55" y="390" width="190" height="55" rx="8" fill="#0C0E18" stroke="#333950" />
  <text x="150" y="415" fill="#FFFFFF" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">Kafka Consumer</text>
  <text x="150" y="432" fill="#EC4899" font-family="sans-serif" font-size="9" text-anchor="middle">Incoming Domain Events</text>

  <!-- Center: Hexagon / Domain Core -->
  <polygon points="480,110 630,200 630,380 480,470 330,380 330,200" fill="#0E1222" stroke="#10B981" stroke-width="2.5" />
  
  <text x="480" y="190" fill="#34D399" font-family="monospace" font-size="14" text-anchor="middle" font-weight="bold">APPLICATION &amp; DOMAIN CORE</text>
  <text x="480" y="210" fill="#94A3B8" font-family="sans-serif" font-size="10" text-anchor="middle">Agnóstico a Bases de Datos y Librerías Externas</text>

  <rect x="375" y="235" width="210" height="85" rx="8" fill="#151A2E" stroke="#10B981" stroke-opacity="0.4" />
  <text x="480" y="260" fill="#FFFFFF" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">Use Cases (Application)</text>
  <text x="480" y="280" fill="#A7F3D0" font-family="sans-serif" font-size="10" text-anchor="middle">CreateOrderUseCase</text>
  <text x="480" y="298" fill="#A7F3D0" font-family="sans-serif" font-size="10" text-anchor="middle">ProcessPaymentUseCase</text>

  <rect x="375" y="335" width="210" height="75" rx="8" fill="#151A2E" stroke="#6366F1" stroke-opacity="0.4" />
  <text x="480" y="360" fill="#C7D2FE" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">Domain Entities &amp; VOs</text>
  <text x="480" y="380" fill="#94A3B8" font-family="sans-serif" font-size="9" text-anchor="middle">Reglas de Negocio Puras (Sin decorators)</text>

  <!-- Ports Indicators -->
  <rect x="310" y="270" width="38" height="24" rx="4" fill="#10B981" />
  <text x="329" y="286" fill="#000000" font-family="monospace" font-size="9" text-anchor="middle" font-weight="bold">PORT</text>

  <rect x="612" y="270" width="38" height="24" rx="4" fill="#38BDF8" />
  <text x="631" y="286" fill="#000000" font-family="monospace" font-size="9" text-anchor="middle" font-weight="bold">PORT</text>

  <!-- Right: Secondary / Driven Adapters -->
  <rect x="700" y="110" width="220" height="370" rx="12" fill="#121524" stroke="#38BDF8" stroke-width="1.5" />
  <text x="810" y="140" fill="#BAE6FD" font-family="monospace" font-size="12" text-anchor="middle" font-weight="bold">Driven Adapters (Output)</text>
  <text x="810" y="160" fill="#64748B" font-family="sans-serif" font-size="9" text-anchor="middle">Implementan puertos de salida</text>

  <rect x="715" y="180" width="190" height="55" rx="8" fill="#0C0E18" stroke="#333950" />
  <text x="810" y="205" fill="#FFFFFF" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">PostgreSQL Repository</text>
  <text x="810" y="222" fill="#38BDF8" font-family="sans-serif" font-size="9" text-anchor="middle">Prisma / TypeORM Implementation</text>

  <rect x="715" y="250" width="190" height="55" rx="8" fill="#0C0E18" stroke="#333950" />
  <text x="810" y="275" fill="#FFFFFF" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">Redis Cache Adapter</text>
  <text x="810" y="292" fill="#F43F5E" font-family="sans-serif" font-size="9" text-anchor="middle">Cache Aside / Sliding Memory</text>

  <rect x="715" y="320" width="190" height="55" rx="8" fill="#0C0E18" stroke="#333950" />
  <text x="810" y="345" fill="#FFFFFF" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">AWS S3 Storage Adapter</text>
  <text x="810" y="362" fill="#F59E0B" font-family="sans-serif" font-size="9" text-anchor="middle">Presigned URLs / Binary Assets</text>

  <rect x="715" y="390" width="190" height="55" rx="8" fill="#0C0E18" stroke="#333950" />
  <text x="810" y="415" fill="#FFFFFF" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">External Payment API</text>
  <text x="810" y="432" fill="#10B981" font-family="sans-serif" font-size="9" text-anchor="middle">Stripe / Yape / KasNet Client</text>

  <!-- Connectors -->
  <path d="M 260 282 L 310 282" stroke="#10B981" stroke-width="2"/>
  <path d="M 650 282 L 700 282" stroke="#38BDF8" stroke-width="2"/>

  <!-- Footer Specs -->
  <text x="40" y="500" fill="#64748B" font-family="monospace" font-size="10">Testabilidad Extrema: 100% de la lógica de negocio se testea con Mocks de Puertos sin tocar bases de datos ni redes</text>
</svg>
